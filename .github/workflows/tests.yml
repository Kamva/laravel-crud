name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: ['10', '11', '12']
        db: [sqlite, pgsql]
        # Each supported Laravel on its oldest or newest PHP, so both ends of
        # the PHP range (8.1 to 8.4) are covered.
        include:
          - laravel: '10'
            php: '8.1'
          - laravel: '11'
            php: '8.2'
          - laravel: '12'
            php: '8.4'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql
          coverage: none

      # No lock file: resolve the newest dependencies for this Laravel.
      # Composer 2.10+ refuses Laravel releases with security advisories,
      # which covers every Laravel 10 and 11 release. The package doesn't pin
      # Laravel for apps, so tests may use them.
      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --no-interaction --no-progress --prefer-dist --no-security-blocking

      - name: Run tests
        run: vendor/bin/phpunit
